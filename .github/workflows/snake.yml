name: Generate Snake

on:
  schedule:
    - cron: "17 6,18 * * *"   # twice a day
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake SVG (matrix palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: EtheXReal
          outputs: |
            dist/github-contribution-grid-snake-matrix.svg?palette=github-dark&color_snake=#00ff41&color_dots=#002b16,#004d26,#006e33,#00a844,#00ff41

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
